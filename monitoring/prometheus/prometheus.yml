global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: legal-rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: ragas-monitor            # scores pushed by `python -m src.monitoring.ragas_monitor`
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
