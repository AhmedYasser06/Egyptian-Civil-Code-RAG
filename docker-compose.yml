# docker compose up --build            -> Qdrant + API on http://localhost:8000
# docker compose --profile gpu up      -> also starts vLLM (AWQ Qwen3-8B); set LLM_PROVIDER=VLLM in .env
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: egyptian-legal-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
    image: ${API_IMAGE:-egyptian-civil-code-rag:latest}
    container_name: egyptian-legal-api
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: egyptian_civil_code
      EMBEDDING_MODEL_PROVIDER: HUGGINGFACE
      EMBEDDING_MODEL_ID: BAAI/bge-m3
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: cpu
      LLM_PROVIDER: ${LLM_PROVIDER:-GROQ}
      GROQ_MODEL_ID: ${GROQ_MODEL_ID:-qwen/qwen3.8-27b}
      GOOGLE_MODEL_ID: ${GOOGLE_MODEL_ID:-gemini-2.5-flash}
      OLLAMA_MODEL_ID: ${OLLAMA_MODEL_ID:-qwen3:1.7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_MODEL_ID: ${VLLM_MODEL_ID:-Qwen/Qwen3-8B-AWQ}
      # Langfuse (self-hosted, see docs/MONITORING.md); empty keys = tracing off
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      DRIFT_REFERENCE_PATH: /app/reports/drift_reference.npz
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    container_name: egyptian-legal-vllm
    command: >
      --model ${VLLM_MODEL_ID:-Qwen/Qwen3-8B-AWQ}
      --max-model-len 8192
      --gpu-memory-utilization 0.85
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qdrant_data:
  hf_cache:
