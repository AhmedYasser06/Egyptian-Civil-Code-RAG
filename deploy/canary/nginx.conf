# Canary rollout: send CANARY_PERCENT of traffic to the new version, the rest to the stable one.
# Change the weights (90/10 -> 50/50 -> 0/100) and `docker compose -f docker-compose.canary.yml
# exec gateway nginx -s reload` to promote; set 100/0 to roll back instantly.
upstream stable { server api_stable:8000; }
upstream canary { server api_canary:8000; }

split_clients "${request_id}" $backend {
    10%     canary;      # <- canary weight
    *       stable;
}

server {
    listen 80;
    location / {
        proxy_pass http://$backend;
        proxy_read_timeout 300s;
        proxy_buffering off;                     # keep /ask/stream token-by-token
        add_header X-Served-By $backend always;  # lets you see (and test) the split
    }
}
