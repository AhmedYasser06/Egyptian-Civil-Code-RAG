[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-civil-code-rag"
version = "0.2.0"
description = "Bilingual Arabic/English RAG over the Egyptian Civil Code, with article citations."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
civil-rag = "src.rag:cli"

[project.optional-dependencies]
serving = ["bentoml>=1.4,<2", "locust>=2.32"]
dev = ["pytest==8.4.2", "ruff==0.16.5", "httpx>=0.27"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

exclude = [
    "src/scripts/extract_civil_code.py",
    "src/scripts/text_splitter.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/evaluation/*" = ["E402"]
"src/evaluation/evaluate_rag_gemini_50.py" = ["E402", "E501"]
"src/mlflow/*" = ["E402"]
"src/optimization/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["corpus: needs the DVC-pulled corpus (skipped when data/ is absent)"]
